# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Version must match Docker tag: 1.3.1
context:
  version: "1.3.1"

package:
  name: qtltools
  version: ${{ version }}

source:
  path: ../upstream/QTLtools_1.3.1_linux64.tar.gz
  sha256: 4ecca8a5cc1aa98516d587233090b2526df15160a8ed8d3eec8eee563300c674

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - mkdir -p "${PREFIX}/bin"
    - if [ -f QTLtools ]; then SRC=QTLtools; else SRC=bin/QTLtools; fi
    - install -m 0755 "${SRC}" "${PREFIX}/bin/QTLtools"

requirements:
  run: []

about:
  homepage: https://qtltools.github.io/qtltools/
  summary: Complete tool set for molecular QTL discovery and analysis
  description: |
    Redistribution of QTLtools 1.3.1 compiled for linux-64 (no official bioconda package).
    Cite Delaneau et al. Nat Commun 2017.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - SiYangming
