# Version must match Docker tag: 1.3.1
{% set version = "1.3.1" %}

package:
  name: qtltools
  version: {{ version }}

source:
  url: file://{{ RECIPE_DIR }}/../upstream/QTLtools_1.3.1_linux64.tar.gz
  sha256: 4ecca8a5cc1aa98516d587233090b2526df15160a8ed8d3eec8eee563300c674

build:
  number: 0
  skip: True  # [not linux]
  script: |
    mkdir -p "${PREFIX}/bin"
    install -m 0755 QTLtools "${PREFIX}/bin/QTLtools" 2>/dev/null || install -m 0755 bin/QTLtools "${PREFIX}/bin/QTLtools"

requirements:
  build: []
  run: []

test:
  commands:
    - test -x "${PREFIX}/bin/QTLtools"

about:
  home: https://qtltools.github.io/qtltools/
  summary: Complete tool set for molecular QTL discovery and analysis
  description: |
    Redistribution of QTLtools 1.3.1 compiled for linux-64 (no official bioconda package).
    Cite Delaneau et al. Nat Commun 2017.
  license: GPL-3.0-or-later
  license_file: LICENSE
  dev_url: https://github.com/qtltools/qtltools

extra:
  recipe-maintainers:
    - SiYangming
